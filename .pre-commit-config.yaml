repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run black
        language: system
        types:
          [
            python,
          ]

      - id: docformatter
        name: docformatter
        entry: uv run docformatter --in-place --recursive
        language: system
        types:
          [
            python,
          ]

      - id: isort
        name: isort
        entry: uv run isort
        language: system
        types:
          [
            python,
          ]

      - id: flake8
        name: flake8
        entry: uv run flake8
        language: system
        types:
          [
            python,
          ]

      - id: mypy
        name: mypy
        entry: uv run mypy src
        language: system
        pass_filenames: false
        types:
          [
            python,
          ]

      - id: bandit
        name: bandit
        entry: uv run bandit -r src
        language: system
        pass_filenames: false
        types:
          [
            python,
          ]
